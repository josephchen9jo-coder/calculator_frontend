<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="panel calculator-panel">
      <header class="panel-header">
        <h1>Calculator</h1>
      </header>

      <div class="display">
        <div id="expression" class="expression" aria-live="polite">0</div>
        <div id="result" class="result" aria-live="polite">0</div>
      </div>

      <div class="buttons" id="buttons">
        <button class="btn function" data-action="clear" title="Clear">C</button>
        <button class="btn function" data-action="append" data-value="(" title="Left parenthesis">(</button>
        <button class="btn function" data-action="append" data-value=")" title="Right parenthesis">)</button>
        <button class="btn operator" data-action="append" data-value="/" title="Divide">÷</button>

        <button class="btn" data-action="append" data-value="7">7</button>
        <button class="btn" data-action="append" data-value="8">8</button>
        <button class="btn" data-action="append" data-value="9">9</button>
        <button class="btn operator" data-action="append" data-value="*" title="Multiply">×</button>

        <button class="btn" data-action="append" data-value="4">4</button>
        <button class="btn" data-action="append" data-value="5">5</button>
        <button class="btn" data-action="append" data-value="6">6</button>
        <button class="btn operator" data-action="append" data-value="-" title="Subtract">−</button>

        <button class="btn" data-action="append" data-value="1">1</button>
        <button class="btn" data-action="append" data-value="2">2</button>
        <button class="btn" data-action="append" data-value="3">3</button>
        <button class="btn operator" data-action="append" data-value="+" title="Add">+</button>

        <button class="btn zero" data-action="append" data-value="0">0</button>
        <button class="btn" data-action="append" data-value=".">.</button>
        <button class="btn function" data-action="backspace" title="Backspace">⌫</button>
        <button class="btn equals" data-action="equals" title="Equals">=</button>
      </div>
    </section>

    <section class="panel history-panel">
      <header class="panel-header">
        <h1>Calculation History</h1>
        <button id="clear-history" class="clear-btn">Clear All</button>
      </header>
      <ul id="history-list" class="history-list">
        <li class="empty">Loading…</li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
